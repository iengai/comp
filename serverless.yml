# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: nopee
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: auth
service: comp

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  profile: kk
  region: ap-northeast-1
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  environment:
    MAILER_NO_REPLY: ${env:MAILER_NO_REPLY, file(./env-${self:provider.stage}.yaml):MAILER_NO_REPLY}
#  iam:
#    role:
#      name: ${self:service}-${self:provider.stage}-ses-send-email-role
#      statements:
#        - Effect: Allow
#          Action:
#            - ses:SendEmail
#          Resource: "*"


parameters:
  USER_POOL_NAME: ${self:service}-${self:provider.stage}-user-pool
  USER_POOL_CLIENT_NAME: ${self:parameters.USER_POOL_NAME}-client

package:
  individually: true

plugins:
  - serverless-scriptable-plugin
  - serverless-iam-roles-per-function

functions:
  define-auth-challenge:
    handler: handler
    package:
      artifact: bin/define-auth-challenge.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: DefineAuthChallenge

  create-auth-challenge:
    handler: handler
    package:
      artifact: bin/create-auth-challenge.zip
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - ses:SendEmail
        Resource: "*"
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: CreateAuthChallenge

  verify-auth-challenge-response:
    handler: handler
    package:
      artifact: bin/verify-auth-challenge-response.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: VerifyAuthChallengeResponse

  post-authentication:
    handler: handler
    package:
      artifact: bin/post-authentication.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: PostAuthentication

#  pre-signup:
#    handler: handler
#    package:
#      artifact: bin/pre-signup.zip
#    events:
#      - cognitoUserPool:
#          pool: CompUserPool
#          trigger: PreSignUp

resources:
  Resources:
    CognitoUserPoolCompUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:parameters.USER_POOL_NAME}
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: false
            RequireNumbers: false
            RequireSymbols: false
            RequireUppercase: false
          SignInPolicy:
            AllowedFirstAuthFactors:
              - EMAIL_OTP
              - PASSWORD
        UsernameAttributes:
          - email

    CompUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:parameters.USER_POOL_CLIENT_NAME}
        UserPoolId: !Ref CognitoUserPoolCompUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - CUSTOM_AUTH_FLOW_ONLY

custom:
  scriptable:
    hooks:
      before:package:createDeploymentArtifacts:
        - docker-compose up go-builder
      after:package:createDeploymentArtifacts:
        - echo "Build and packaging complete"
