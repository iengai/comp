resources:
  Resources:
    CognitoUserPoolCompUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:parameters.USER_POOL_NAME}
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: false
            RequireNumbers: false
            RequireSymbols: false
            RequireUppercase: false
          SignInPolicy:
            AllowedFirstAuthFactors:
              - EMAIL_OTP
              - PASSWORD
        UsernameAttributes:
          - email
    CompUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:parameters.USER_POOL_CLIENT_NAME}
        UserPoolId: !Ref CognitoUserPoolCompUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - CUSTOM_AUTH_FLOW_ONLY

