# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: nopee
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: auth # todo change to comp
service: user

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  profile: kk
  region: ap-northeast-1
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  environment:
    MAILER_NO_REPLY: ${env:MAILER_NO_REPLY, file(./env-${self:provider.stage}.yaml):MAILER_NO_REPLY}
    AUTH_TABLE: ${env:AUTH_TABLE, file(./env-${self:provider.stage}.yaml):AUTH_TABLE}

parameters:
  PREFIX: ${self:service}-${self:provider.stage}
  USER_POOL_NAME: ${self:parameters.PREFIX}-user-pool
  USER_POOL_CLIENT_NAME: ${self:parameters.PREFIX}-user-pool-client

package:
  individually: true

plugins:
  - serverless-scriptable-plugin
  - serverless-iam-roles-per-function

functions:
  define-auth-challenge:
    handler: handler
    package:
      artifact: bin/define-auth-challenge.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: DefineAuthChallenge

  create-auth-challenge:
    handler: handler
    package:
      artifact: bin/create-auth-challenge.zip
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - ses:SendEmail
        Resource: "*"
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: CreateAuthChallenge

  verify-auth-challenge-response:
    handler: handler
    package:
      artifact: bin/verify-auth-challenge-response.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: VerifyAuthChallengeResponse

  post-authentication:
    handler: handler
    package:
      artifact: bin/post-authentication.zip
    events:
      - cognitoUserPool:
          pool: CompUserPool
          trigger: PostAuthentication

